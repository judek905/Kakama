<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo platform | Kakama</title><link rel="stylesheet" href="css/style.css"></head><body>
<nav><div class="wrap"><a class="logo" href="index.html">Kaka<b>ma</b></a><a href="index.html">Home</a><a href="trade.html">Demo platform</a><a href="risk.html">Risk</a><a class="btn" href="login.html">Open account</a></div></nav>
<main class="wrap"><div class="notice" style="margin:24px 0 0">Demo account: simulated prices, virtual money.</div>
<div class="platform"><section class="panel"><div class="bar"><select id="pair" aria-label="Market"><option>BTC/USDT</option><option>ETH/USDT</option><option>SOL/USDT</option><option>XRP/USDT</option></select><span id="price">0</span></div><canvas id="cv" aria-label="Price chart"></canvas></section>
<aside class="panel side"><p style="color:var(--mute)">Balance</p><p id="bal" style="font:700 26px Georgia,serif">$10,000.00</p><label for="amt">Amount (USD)</label><input id="amt" type="number" min="10" value="500"><button class="btn" id="buy">Buy (long)</button><button class="btn" id="sell">Sell (short)</button><button class="btn ghost" id="reset">Reset demo</button><p id="msg" style="margin-top:12px;font-size:14px;color:var(--mute)" role="status"></p></aside>
<section class="panel pos"><table><thead><tr><th>Market</th><th>Side</th><th>Size</th><th>Entry</th><th>P&amp;L</th><th></th></tr></thead><tbody id="rows"></tbody></table></section></div></main>
<script src="js/trade.js"></script><footer><div class="wrap">Kakama is a demonstration project. Prices are simulated and no real money is used. Crypto trading carries a high risk of loss. <a href="risk.html">Read the risk disclosure.</a></div></footer></body></html>
